name: CI + Blue-Green Deployment - Frutas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Tests (Jest + Supertest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install deps
        run: npm ci

      - name: Run lint
        run: npm run lint || true

      - name: Run tests
        run: npm test

  build-and-push:
    name: Build and push image to GHCR
    needs: test-backend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    # 🔥 ESTE BLOQUE ES EL QUE PERMITE PUBLICAR EN GHCR
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # 🔥 IMAGEN FINAL (todo minúsculas)
          tags: ghcr.io/valeria-miguel/reme-supertest-blue-green:latest

  deploy:
    name: Deploy directo en puerto 80 (sin Nginx ni blue-green)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: SSH to VPS and deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            
            # Ruta donde está tu proyecto en el VPS
            cd ${{ secrets.APP_PATH }} || exit 1

            IMAGE="ghcr.io/valeria-miguel/reme-supertest-blue-green:latest"

            echo "Pulling latest image..."
            docker pull $IMAGE

            echo "Parando y eliminando contenedor anterior (si existe)..."
            docker stop frutas-directo 2>/dev/null || true
            docker rm frutas-directo 2>/dev/null || true

            echo "Levantando nuevo contenedor directo en puerto 80..."
            docker run -d \
              --name frutas-directo \
              -p 80:3000 \
              -v /home/dulce/reme-Supertest-Blue-Green/frontend:/app/frontend \
              --restart unless-stopped \
              $IMAGE

            echo "Desplegado exitosamente en http://143.198.23.14"
            echo "Listo! Tu demo de frutas está en vivo"