name: CI + Blue-Green Deployment - Frutas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Tests (Jest + Supertest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install deps
        run: npm ci

      - name: Run lint
        run: npm run lint || true

      - name: Run tests
        run: npm test

  build-and-push:
    name: Build and push image to GHCR
    needs: test-backend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/valeria-miguel/reme-supertest-blue-green:latest

  deploy:
    name: Blue-Green deploy (GCP)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: SSH to GCP and deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.GCP_PORT }}

          script: |
            set -e
            cd ${{ secrets.APP_PATH }} || exit 1

            IMAGE="ghcr.io/valeria-miguel/reme-supertest-blue-green:latest"

            echo "Pulling image: $IMAGE"
            docker pull $IMAGE

            # Determinar entorno activo de Nginx (blue/green)
            ACTIVE_PORT=$(grep -o "server 127.0.0.1:300[12]" /etc/nginx/sites-available/app.conf | grep -o "300[12]" || echo "3001")

            if [ "$ACTIVE_PORT" = "3001" ]; then
              DEPLOY_ENV="green"
              DEPLOY_PORT=3002
              CONTAINER_NAME="frutas-green"
              FRONTEND_FOLDER="frontend-green"
            else
              DEPLOY_ENV="blue"
              DEPLOY_PORT=3001
              CONTAINER_NAME="frutas-blue"
              FRONTEND_FOLDER="frontend-blue"
            fi

            echo "Deploying to $DEPLOY_ENV on port $DEPLOY_PORT"

            # Copiar frontend al nuevo entorno (Blue-Green para frontend)
            rm -rf $FRONTEND_FOLDER
            cp -r frontend $FRONTEND_FOLDER

            # Eliminar contenedor previo si existe
            docker rm -f $CONTAINER_NAME 2>/dev/null || true

            # Crear nuevo contenedor para backend
            docker run -d \
              --name $CONTAINER_NAME \
              -p $DEPLOY_PORT:3000 \
              --restart unless-stopped \
              $IMAGE

            # Esperar y validar health check
            sleep 5

            if curl -s http://127.0.0.1:$DEPLOY_PORT/health | grep -q 'OK'; then
              echo "Healthy. Switching Nginx upstream..."
              ./scripts/switch.sh $DEPLOY_ENV
            else
              echo "❌ Health check failed."
              docker logs $CONTAINER_NAME --tail 200
              exit 1
            fi