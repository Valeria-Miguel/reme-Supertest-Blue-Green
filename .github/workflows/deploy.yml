
name: CI + Blue-Green Deployment - Backend Frutas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Tests (Jest + Supertest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install deps
        run: npm ci
      - name: Lint (no rompe el pipeline)
        run: npm run lint || true
      - name: Run tests
        run: npm test

  build-and-push:
    name: Build and push image to GHCR
    needs: test-backend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/valeria-miguel/reme-supertest-blue-green:latest

  deploy:
    name: Blue-Green deploy (VPS Backend)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: SSH to VPS and deploy backend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          script: |
            set -e

            cd ${{ secrets.APP_PATH }}
            IMAGE="ghcr.io/valeria-miguel/reme-supertest-blue-green:latest"

            echo "Pulling latest image from GHCR..."
            docker pull $IMAGE

            # Detectar entorno activo leyendo el puerto del upstream de Nginx
            ACTIVE_PORT=$(grep -o "300[12]" /etc/nginx/sites-available/app.conf | head -1 || echo "3001")

            if [ "$ACTIVE_PORT" = "3001" ]; then
              NEW="green"
              NEW_PORT=3002
              NEW_CONTAINER="frutas-green"
            else
              NEW="blue"
              NEW_PORT=3001
              NEW_CONTAINER="frutas-blue"
            fi

            echo "Deploying $NEW on port $NEW_PORT"

            # Liberar el puerto si está ocupado por cualquier contenedor
            OCCUPIED=$(docker ps -q --filter "publish=$NEW_PORT")
            if [ -n "$OCCUPIED" ]; then
              echo "Port $NEW_PORT in use, removing container(s): $OCCUPIED"
              docker rm -f $OCCUPIED
            fi

            # Borrar contenedor viejo de ese color si existe
            docker rm -f $NEW_CONTAINER 2>/dev/null || true

            # Levantar nuevo contenedor
            docker run -d \
              --name $NEW_CONTAINER \
              -p $NEW_PORT:3000 \
              --restart unless-stopped \
              $IMAGE

            echo "Waiting for container health..."
            sleep 8

            chmod +x scripts/switch.sh scripts/rollback.sh

            if curl -sf http://127.0.0.1:$NEW_PORT/health; then
              echo "Healthy → switching to $NEW"
              bash scripts/switch.sh $NEW
            else
              echo "Health failed → rollback"
              bash scripts/rollback.sh
              exit 1
            fi
