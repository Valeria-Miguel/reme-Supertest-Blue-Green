name: CI + Blue-Green Deployment - Backend Frutas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Tests (Jest + Supertest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: npm run lint || true
      - run: npm test

  build-and-push:
    name: Build and push image to GHCR
    needs: test-backend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/valeria-miguel/reme-supertest-blue-green:latest

  deploy:
    name: Blue-Green deploy (VPS Backend)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: SSH to VPS and deploy backend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          script: |
            set -e
            cd ${{ secrets.APP_PATH }}
            IMAGE="ghcr.io/valeria-miguel/reme-supertest-blue-green:latest"

            # Detectar entorno activo
            ACTIVE_PORT=$(grep -o "300[12]" /etc/nginx/sites-available/app.conf | head -1 || echo "3001")

            if [ "$ACTIVE_PORT" = "3001" ]; then
              NEW="green"
              NEW_PORT=3002
              NEW_CONTAINER="frutas-green"
            else
              NEW="blue"
              NEW_PORT=3001
              NEW_CONTAINER="frutas-blue"
            fi

            echo "Deploying $NEW on port $NEW_PORT"

            # Backend contenedor
            docker rm -f $NEW_CONTAINER 2>/dev/null || true
            docker run -d --name $NEW_CONTAINER -p $NEW_PORT:3000 --restart unless-stopped $IMAGE

            sleep 8

            if curl -sf http://127.0.0.1:$NEW_PORT/health; then
              echo "Healthy → switching to $NEW"
              ./scripts/switch.sh $NEW
            else
              echo "Health failed → rollback"
              ./scripts/rollback.sh
              exit 1
            fi
